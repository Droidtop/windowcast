[package]
name = "windowcast-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "windowcast_client"
# cdylib so this compiles into a shared library embedders (droidtop's JNI
# bridge, the Android library, a desktop client) link against directly;
# rlib too so it's also usable as a normal Rust dependency (cli-tools does).
crate-type = ["cdylib", "rlib"]

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-identity = { path = "../identity" }
windowcast-transport = { path = "../transport" }
# The RDP backend's client (IronRDP underneath; see NOTICE).
windowcast-rdp = { path = "../rdp", default-features = false }
windowcast-accounts = { path = "../accounts" }
windowcast-terminal = { path = "../terminal" }
tokio = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json = "1"
# Opus for the microphone (libopus, BSD-3-Clause, built from source), the
# one encoder every client sends with.
opus = "0.3"
bytes = "1"
thiserror.workspace = true

[features]
# Kerberos sign-in with the user's tickets (needs the krb5 development
# headers on Unix); off for Android.
kerberos = ["windowcast-accounts/kerberos"]
