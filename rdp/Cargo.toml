[package]
name = "windowcast-rdp"
description = "RDP for windowcast: one window served over RDP, and a client for RDP hosts, on IronRDP's protocol crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-host = { path = "../host-core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
# IronRDP (Devolutions; MIT or Apache-2.0, see NOTICE): the RDP protocol
# layer. windowcast's own code is the window, input and stream handling.
ironrdp-server = { version = "0.13", default-features = false }
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-blocking = "0.10"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.16"
sha2 = "0.10"

[dev-dependencies]
windowcast-cli-tools = { path = "../cli-tools" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
