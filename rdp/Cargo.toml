[package]
name = "windowcast-rdp"
description = "RDP for windowcast: one window served over RDP, and a client for RDP hosts, on IronRDP's protocol crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["host"]
# Serving windows over RDP; without it the crate is only the client (what
# client-core takes).
host = [
    "dep:windowcast-host",
    "dep:ironrdp-server",
    "dep:tokio",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:windows",
]

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-host = { path = "../host-core", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"], optional = true }
# IronRDP (Devolutions; MIT or Apache-2.0, see NOTICE): the RDP protocol
# layer. windowcast's own code is the window, input and stream handling.
ironrdp-server = { version = "0.13", default-features = false, optional = true }
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-blocking = "0.10"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
ironrdp-svc = "0.8"
ironrdp-core = "0.2"
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"], optional = true }
x509-parser = "0.16"
sha2 = "0.10"
tracing.workspace = true
rand_core.workspace = true

# RemoteApp launches on Windows hosts: Remote Desktop's settings and
# sessions, the host-made users and DPAPI for their passwords.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
windowcast-identity = { path = "../identity" }
windowcast-accounts = { path = "../accounts" }
windowcast-cli-tools = { path = "../cli-tools" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
