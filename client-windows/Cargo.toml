[package]
name = "windowcast-client-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Windows end of the client: a streamed window decoded on the GPU
# (Media Foundation with a Direct3D 11 device) and shown in a native window
# of its own. The Windows counterpart of the Android library's MediaCodec
# onto a Surface.

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-client-core = { path = "../client-core" }

[target.'cfg(windows)'.dependencies]
# Opus for window audio (BSD-3-Clause), libopus built from source.
opus = "0.3"
audiopus_sys = { version = "0.2", features = ["static"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
