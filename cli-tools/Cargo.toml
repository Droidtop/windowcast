[package]
name = "windowcast-cli-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "windowcast-client"
path = "src/client.rs"

[[bin]]
name = "windowcast-testhost"
path = "src/testhost.rs"

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-host = { path = "../host-core" }
windowcast-client-core = { path = "../client-core" }
tokio = { workspace = true, features = ["net"] }
# Software H.264 for the test pattern host and the client's decode check;
# builds OpenH264 (BSD-2-Clause) from source.
openh264 = "0.9"
# Decodes a window's sound to report its level and pitch.
opus = "0.3"

[dev-dependencies]
windowcast-identity = { path = "../identity" }
windowcast-transport = { path = "../transport" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# setns, for the test that runs host and client in network namespaces.
libc = "0.2"
