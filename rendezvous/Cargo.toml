[package]
name = "windowcast-rendezvous"
description = "Finding a paired device away from the LAN: Syncthing's global discovery, STUN and hole punching (addresses only, never data)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand_core.workspace = true
serde.workspace = true
serde_json = "1"
# Syncthing's global discovery over https with a client certificate made
# from the device key.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
