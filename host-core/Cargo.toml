[package]
name = "windowcast-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-identity = { path = "../identity" }
windowcast-pairing = { path = "../pairing" }
windowcast-transport = { path = "../transport" }
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
bytes = "1"
# The software H.264 encoder every host can fall back to (BSD-2-Clause,
# built from source).
openh264 = "0.9"
# Opus for window audio (BSD-3-Clause), libopus built from source.
opus = "0.3"
audiopus_sys = { version = "0.2", features = ["static"] }
