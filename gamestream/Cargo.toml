[package]
name = "windowcast-gamestream"
description = "GameStream (Sunshine, Apollo, Moonlight): windowcast's own implementation, client and host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-host = { path = "../host-core" }
windowcast-transport = { path = "../transport" }
thiserror.workspace = true
rand_core.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros"] }
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
x509-parser = "0.16"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
# ENet, which GameStream's control stream runs on (MIT; a transpilation of
# ENet 1.3.17, the protocol Moonlight and Sunshine use).
rusty_enet = "0.4"
# AES-GCM for the control stream.
aes-gcm = "0.10"

[dev-dependencies]
windowcast-cli-tools = { path = "../cli-tools" }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }
