[package]
name = "windowcast-agent-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "windowcast-agent-linux"
path = "src/main.rs"

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-identity = { path = "../identity" }
windowcast-pairing = { path = "../pairing" }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
thiserror.workspace = true

# windowcast-transport (WebRTC session serving) and tokio are real
# dependencies of the *next* piece of work here (wiring this agent up to
# actually accept a session) — deliberately not added until main.rs
# actually calls them, per "don't add for hypothetical future work."
