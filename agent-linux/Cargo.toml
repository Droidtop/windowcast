[package]
name = "windowcast-agent-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "windowcast-agent-linux"
path = "src/main.rs"

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-identity = { path = "../identity" }
windowcast-pairing = { path = "../pairing" }
windowcast-transport = { path = "../transport" }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
