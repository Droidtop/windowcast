[package]
name = "windowcast-agent-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "windowcast-agent-linux"
path = "src/main.rs"

# A window that paints one colour and logs the input it gets: the window
# the agent's tests capture and type into, under a headless sway.
[[bin]]
name = "windowcast-test-window"
path = "src/bin/test_window.rs"
test = false

[dependencies]
windowcast-protocol = { path = "../protocol" }
windowcast-host = { path = "../host-core" }
windowcast-rdp = { path = "../rdp" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }
rustix = { version = "1", features = ["fs", "mm", "event"] }
serde_json = "1"
# The PulseAudio client API (PulseAudio, or PipeWire's pulse server).
libpulse-binding = "2"
# Virtual gamepads through uinput (and reading them back in tests).
evdev = "0.13"
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
opus = "0.3"
tokio = { workspace = true, features = ["net"] }
windowcast-client-core = { path = "../client-core" }
windowcast-identity = { path = "../identity" }
windowcast-cli-tools = { path = "../cli-tools" }
