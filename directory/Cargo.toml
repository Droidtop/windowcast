[package]
name = "windowcast-directory"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windowcast-identity = { path = "../identity" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
serde.workspace = true
serde_json = "1"
rand_core.workspace = true
thiserror.workspace = true
# Session certificates: a standard, audited claims-token format (PASETO)
# instead of hand-rolled "sign a bincode blob" -- see docs/SECURITY.md.
rusty_paseto = { version = "0.10", features = ["v4_public"] }
time = { version = "0.3", features = ["formatting"] }
