name: Viewer release

# The Android viewer (dev.windowcast.viewer) as a signed APK on each windowcast
# release, so droidtop can offer it (Droidtop/tracker#552), and the Android
# library (windowcast-android-<version>.aar) that droidtop embeds
# (Droidtop/tracker#428), each with its own checksum file. Signed with the key
# in this repository's secrets, under the names droidtop's releases use
# (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS,
# SIGNING_KEY_PASSWORD): one key for every release, so each installs over the
# last. Without them this fails rather than publish an unsigned viewer.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the viewer built from this tag to its existing release"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: The tag is the version the viewer reports
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "No SIGNING_KEYSTORE_BASE64 secret: a release viewer must be signed."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/viewer-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/viewer-release.jks" >> "$GITHUB_ENV"

      - name: Build client-core for Android
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 \
            -o android/windowcast/src/main/jniLibs \
            build --release -p windowcast-client-core

      - name: Build the signed viewer
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :windowcast:testDebugUnitTest :viewer:testDebugUnitTest :windowcast:assembleRelease :viewer:assembleRelease --stacktrace

      - name: Check the signature and name the APK
        run: |
          set -eu
          apk=android/viewer/build/outputs/apk/release/viewer-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mkdir out
          cp "$apk" "out/windowcast-viewer-$VERSION.apk"
          (cd out && sha256sum -- "windowcast-viewer-$VERSION.apk" > SHA256SUMS-viewer)
          # The library droidtop embeds: both ABIs of client-core inside, unsigned (it is not installed).
          aar=$(ls android/windowcast/build/outputs/aar/*-release.aar)
          cp "$aar" "out/windowcast-android-$VERSION.aar"
          (cd out && sha256sum -- "windowcast-android-$VERSION.aar" > SHA256SUMS-android-library)
          for abi in arm64-v8a x86_64; do
            unzip -l "out/windowcast-android-$VERSION.aar" | grep -q "jni/$abi/.*\.so" \
              || { echo "the AAR carries no native library for $abi"; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowcast-viewer
          path: out/

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windowcast-viewer
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --repo "$REPO" --clobber
