name: Linux packages

# The Linux host agent, the reference app, the command-line client and the
# test host, built for x86_64 and aarch64 and packed four ways
# (packaging/linux): a portable tarball, one runnable file, a .deb and an
# .rpm. Each is installed and removed again here before it is offered.
#
# They are attached to a release (with install.sh, uninstall.sh and
# SHA256SUMS-linux) when one is published, or when this workflow is run by
# hand with a release tag. A push to main or a ci/ branch that changes the
# packaging builds and tests them and attaches nothing.
on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "packaging/linux/**"
      - ".github/workflows/linux-packages.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the packages built from this branch to this existing release (empty: build only)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libpulse-dev pkg-config libpam0g-dev libkrb5-dev \
            squashfs-tools zstd shellcheck desktop-file-utils

      - name: Check the scripts
        run: |
          set -eu
          shellcheck -s sh packaging/linux/*.sh
          desktop-file-validate packaging/linux/windowcast.desktop

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux-packages

      - name: Build the programs
        run: |
          set -eu
          cargo build --release \
            -p windowcast-agent-linux --bin windowcast-agent-linux \
            -p windowcast-app --bin windowcast-app \
            -p windowcast-cli-tools --bin windowcast-client --bin windowcast-testhost
          mkdir bins
          for b in windowcast-agent-linux windowcast-app windowcast-client windowcast-testhost; do
            cp "target/release/$b" bins/
          done

      - name: Build the packages
        env:
          ARCH: ${{ matrix.arch }}
          TOOLS_DIR: ${{ runner.temp }}/linux-tools
        run: sh packaging/linux/build.sh --arch "$ARCH" --bins bins --out linux

      - name: Install and remove it again (tarball and single file)
        run: sh packaging/linux/test.sh linux "${{ matrix.arch }}"

      - name: The .deb installs on a clean Ubuntu, ships its unit disabled, and removes cleanly
        run: |
          set -eu
          dpkg-deb -I linux/*.deb
          dpkg-deb -c linux/*.deb
          docker run --rm -v "$PWD/linux:/pkg:ro" ubuntu:24.04 sh -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            for b in windowcast-agent-linux windowcast-app windowcast-client windowcast-testhost; do
              missing=$(ldd /usr/bin/$b | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$b: $missing"; exit 1; fi
            done
            test -f /usr/lib/systemd/user/windowcast-agent.service
            test -f /usr/share/applications/windowcast.desktop
            if [ -e /etc/systemd/user/graphical-session.target.wants/windowcast-agent.service ]; then echo "the unit is enabled"; exit 1; fi
            apt-get remove -y -qq windowcast
            for f in /usr/bin/windowcast-app /usr/lib/systemd/user/windowcast-agent.service /usr/share/applications/windowcast.desktop; do
              if [ -e "$f" ]; then echo "left behind: $f"; exit 1; fi
            done'

      - name: The .rpm installs on a clean Fedora, and removes cleanly
        run: |
          set -eu
          docker run --rm -v "$PWD/linux:/pkg:ro" fedora:42 sh -c '
            set -eu
            rpm -qpi /pkg/*.rpm
            rpm -qpl /pkg/*.rpm
            dnf install -y /pkg/*.rpm
            for b in windowcast-agent-linux windowcast-app windowcast-client windowcast-testhost; do
              missing=$(ldd /usr/bin/$b | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$b: $missing"; exit 1; fi
            done
            test -f /usr/lib/systemd/user/windowcast-agent.service
            rpm -e windowcast
            if [ -e /usr/bin/windowcast-app ]; then echo "left behind"; exit 1; fi'

      - name: One copy of the install scripts in the release
        if: matrix.arch != 'x86_64'
        run: rm -f linux/install.sh linux/uninstall.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowcast-linux-packages-${{ matrix.arch }}
          path: linux/

  attach:
    # Only for a release: published, or named by hand.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: linux
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          (cd linux && sha256sum -- * > ../SHA256SUMS-linux && mv ../SHA256SUMS-linux .)
          ls -l linux
          gh release upload "$TAG" linux/* --repo "$REPO" --clobber
