name: Android and Windows builds

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # client-core cross-compiled for both Android ABIs, the Android library
    # (JNI over the C interface, MediaCodec decoding) and the viewer app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build client-core for Android
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 \
            -o android/windowcast/src/main/jniLibs \
            build --release -p windowcast-client-core

      - name: Build the Android library and the viewer
        working-directory: android
        run: ./gradlew :windowcast:assembleRelease :viewer:assembleDebug --stacktrace

      # Android loads the bridge's dependencies by name; a path from this
      # machine in its NEEDED entries is a library that never loads.
      - name: The JNI bridge needs the client library by name
        run: |
          set -eu
          readelf=$(ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          found=$(find android -path '*/build/*' -name libwindowcast_jni.so)
          [ -n "$found" ]
          for so in $found; do
            needed=$("$readelf" -d "$so" | grep NEEDED)
            echo "$so: $needed"
            if echo "$needed" | grep -q '/'; then echo "a path in NEEDED"; exit 1; fi
            echo "$needed" | grep -q '\[libwindowcast_client.so\]'
          done

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowcast-android
          path: |
            android/windowcast/build/outputs/aar/*.aar
            android/viewer/build/outputs/apk/debug/*.apk

  windows:
    # The Windows host agent, the reference app and the test host. The
    # agent's test captures a real window with Windows.Graphics.Capture,
    # encodes it with every encoder the runner has, streams it over
    # loopback and decodes it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Clippy
        run: cargo clippy -p windowcast-agent-windows -p windowcast-client-windows -p windowcast-app --all-targets -- -D warnings

      - name: Test the agent (capture, encode, stream, decode)
        env:
          WINDOWCAST_TEST_ON_SCREEN: "1"
        run: cargo test -p windowcast-agent-windows --no-fail-fast -- --nocapture

      - name: Build
        run: cargo build --release -p windowcast-cli-tools -p windowcast-agent-windows -p windowcast-app --bins

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowcast-windows
          path: |
            target/release/windowcast-agent-windows.exe
            target/release/windowcast-app.exe
            target/release/windowcast-testhost.exe
            target/release/windowcast-client.exe
            target/debug/deps/encoders-*.exe
