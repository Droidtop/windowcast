name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libpulse-dev pkg-config libpam0g-dev libkrb5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      # Same-device sessions (droidtop and its own desktop container) must
      # connect with no network up: run the two-peer tests again in a
      # network namespace whose only interface is loopback.
      - name: Loopback-only network
        run: |
          cargo test -p windowcast-transport --test loopback --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "loopback") | .executable'             > loopback-test-path
          sudo unshare -n sh -c "ip link set lo up && $(cat loopback-test-path)"

      # Adaptive quality over a real bottleneck: tc netem shapes lo in a
      # namespace of the test's own (cli-tools/tests/adaptive.rs).
      - name: Adaptive quality under netem
        run: |
          sudo modprobe sch_netem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
          cargo test -p windowcast-cli-tools --test adaptive --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "adaptive") | .executable'             > adaptive-test-path
          sudo unshare -n sh -c "ip link set lo up && WINDOWCAST_TEST_NETEM=1 $(cat adaptive-test-path) --nocapture"

      # A session away from the LAN across two NATs: network namespaces,
      # Linux routers that masquerade, a STUN server between
      # (cli-tools/tests/away.rs). Root for the namespaces and NAT rules.
      - name: Away from the LAN across two NATs
        run: |
          cargo test -p windowcast-cli-tools --test away --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "away") | .executable'             > away-test-path
          sudo WINDOWCAST_TEST_NAT=1 "$(cat away-test-path)" --nocapture

      # Virtual gamepads through uinput, read back from /dev/input. Root for
      # the device nodes; the module may live in the kernel's extra modules.
      - name: Gamepads through uinput
        run: |
          sudo modprobe uinput || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uinput; }
          cargo test -p windowcast-agent-linux --test gamepad --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "gamepad") | .executable'             > gamepad-test-path
          sudo WINDOWCAST_TEST_UINPUT=1 "$(cat gamepad-test-path)" --nocapture

      # Account sign-in against identity services run on this runner only
      # (docs/ACCOUNTS.md): Dex for OpenID Connect (its mock connector signs
      # in without a form), slapd for LDAP, an MIT KDC for Kerberos, and a
      # local user through PAM. Nothing outside the runner is asked.
      - name: Sign-in against local identity services
        run: |
          set -eu
          # OpenID Connect: Dex with a public client and no stored users.
          cat > /tmp/dex.yaml <<'YAML'
          issuer: http://127.0.0.1:5556/dex
          storage:
            type: memory
          web:
            http: 127.0.0.1:5556
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: false
          connectors:
            - type: mockCallback
              id: mock
              name: Mock
          staticClients:
            - id: windowcast
              name: windowcast
              public: true
          YAML
          docker run -d --name dex --network host -v /tmp/dex.yaml:/dex.yaml:ro \
            ghcr.io/dexidp/dex:v2.41.1 dex serve /dex.yaml
          # LDAP: slapd for dc=windowcast,dc=test, one user in one group.
          printf '%s\n' \
            'slapd slapd/domain string windowcast.test' \
            'slapd shared/organization string windowcast' \
            'slapd slapd/password1 password admin-password' \
            'slapd slapd/password2 password admin-password' \
            'slapd slapd/no_configuration boolean false' | sudo debconf-set-selections
          printf '%s\n' 'krb5-config krb5-config/default_realm string WINDOWCAST.TEST' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y slapd ldap-utils \
            krb5-kdc krb5-admin-server krb5-user
          cat > /tmp/seed.ldif <<'LDIF'
          dn: ou=people,dc=windowcast,dc=test
          objectClass: organizationalUnit
          ou: people

          dn: ou=groups,dc=windowcast,dc=test
          objectClass: organizationalUnit
          ou: groups

          dn: uid=alice,ou=people,dc=windowcast,dc=test
          objectClass: inetOrgPerson
          uid: alice
          cn: Alice
          sn: Example
          userPassword: alice-password

          dn: cn=streamers,ou=groups,dc=windowcast,dc=test
          objectClass: groupOfNames
          cn: streamers
          member: uid=alice,ou=people,dc=windowcast,dc=test
          LDIF
          ldapadd -x -H ldap://127.0.0.1 -D cn=admin,dc=windowcast,dc=test -w admin-password -f /tmp/seed.ldif
          # Kerberos: realm WINDOWCAST.TEST on loopback, a user and a service.
          printf '%s\n' '[libdefaults]' ' default_realm = WINDOWCAST.TEST' ' dns_lookup_kdc = false' \
            ' dns_lookup_realm = false' ' rdns = false' '[realms]' \
            ' WINDOWCAST.TEST = {' '  kdc = 127.0.0.1' '  admin_server = 127.0.0.1' ' }' \
            | sudo tee /etc/krb5.conf > /dev/null
          sudo kdb5_util create -s -r WINDOWCAST.TEST -P master-password
          sudo kadmin.local -q 'addprinc -pw alice-password alice'
          sudo kadmin.local -q 'addprinc -randkey host/localhost'
          sudo kadmin.local -q 'ktadd -k /tmp/windowcast.keytab host/localhost'
          sudo chmod 644 /tmp/windowcast.keytab
          sudo systemctl restart krb5-kdc
          export KRB5CCNAME=FILE:/tmp/windowcast-ccache
          echo alice-password | kinit alice
          # PAM: a local user, checked through a service file of our own.
          sudo useradd -m wcpam
          echo 'wcpam:Wc-pam-test-1' | sudo chpasswd
          printf '%s\n' '@include common-auth' '@include common-account' \
            | sudo tee /etc/pam.d/windowcast > /dev/null
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done

          cargo test -p windowcast-accounts --all-features --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "windowcast_accounts") | .executable' \
            > accounts-test-path
          WINDOWCAST_TEST_LDAP=ldap://127.0.0.1:389 \
          WINDOWCAST_TEST_KERBEROS_SERVICE=host/localhost@WINDOWCAST.TEST \
          WINDOWCAST_TEST_KERBEROS_USER=alice@WINDOWCAST.TEST \
          KRB5_KTNAME=/tmp/windowcast.keytab \
            "$(cat accounts-test-path)" --nocapture
          # pam_unix reads /etc/shadow for another user's password: root.
          sudo WINDOWCAST_TEST_OS_USER=wcpam WINDOWCAST_TEST_OS_PASSWORD=Wc-pam-test-1 \
            WINDOWCAST_TEST_PAM_SERVICE=windowcast "$(cat accounts-test-path)" os::tests --nocapture
          WINDOWCAST_TEST_OIDC=http://127.0.0.1:5556/dex \
            cargo test -p windowcast-cli-tools --test accounts -- --nocapture \
            || { docker logs dex; exit 1; }

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  linux-sway:
    # The Linux agent against a real compositor: a headless sway (Arch's,
    # for ext-image-copy-capture and the toplevel capture source, which
    # Ubuntu's sway 1.9 lacks) runs a test window that the agent captures,
    # streams over loopback and types into.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust nasm cmake sway wayland libxkbcommon xkeyboard-config pulseaudio libpulse moonlight-qt freerdp

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the agent's tests
        run: cargo test -p windowcast-agent-linux --no-run

      - name: Capture and input under headless sway
        shell: bash
        run: |
          trap 'echo "--- sway log"; cat /tmp/sway.log' EXIT
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          printf 'output HEADLESS-1 resolution 1280x720\n' > /tmp/sway.cfg
          # Arch's sway carries a file capability (cap_sys_nice) the
          # container may not grant, which fails exec; a plain copy has none.
          cp "$(command -v sway)" /tmp/sway
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            /tmp/sway -c /tmp/sway.cfg > /tmp/sway.log 2>&1 &
          for i in $(seq 1 100); do ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock >/dev/null 2>&1 && break; sleep 0.1; done
          export WAYLAND_DISPLAY=$(cd "$XDG_RUNTIME_DIR" && ls wayland-* | grep -v lock | head -1)
          export SWAYSOCK=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock | head -1)
          # PulseAudio with no sound card plays into a null sink, which is
          # all the window-sound check needs.
          # It refuses to start without a machine id, which containers lack.
          [ -s /etc/machine-id ] || tr -d - < /proc/sys/kernel/random/uuid > /etc/machine-id
          # The job's HOME belongs to another user; the daemon gets its own,
          # and clients find its cookie through PULSE_COOKIE.
          mkdir -p /tmp/pulsehome
          HOME=/tmp/pulsehome pulseaudio --daemonize --exit-idle-time=-1             --log-target=file:/tmp/pulse.log || { cat /tmp/pulse.log; exit 1; }
          export PULSE_COOKIE=/tmp/pulsehome/.config/pulse/cookie
          WINDOWCAST_TEST_SWAY=1 WINDOWCAST_TEST_PULSE=1 cargo test -p windowcast-agent-linux -- --nocapture
          # Stock Moonlight (Arch's moonlight-qt) pairs with our GameStream
          # host and lists its apps. Its own HOME, and no mDNS, so it sees
          # only the test host.
          mkdir -p "/tmp/moonhome/.config/Moonlight Game Streaming Project"
          printf '%s\n' '[General]' 'enableMdns=false' > "/tmp/moonhome/.config/Moonlight Game Streaming Project/Moonlight.conf"
          HOME=/tmp/moonhome QT_QPA_PLATFORM=wayland WINDOWCAST_TEST_MOONLIGHT=1 \
            cargo test -p windowcast-gamestream --test moonlight -- --nocapture
          # Stock FreeRDP (Arch's wlfreerdp3) logs in to our RDP host and
          # shows the test pattern window.
          mkdir -p /tmp/rdphome
          HOME=/tmp/rdphome WINDOWCAST_TEST_FREERDP=1 \
            cargo test -p windowcast-rdp --test freerdp -- --nocapture
