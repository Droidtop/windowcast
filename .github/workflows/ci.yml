name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      # Same-device sessions (droidtop and its own desktop container) must
      # connect with no network up: run the two-peer tests again in a
      # network namespace whose only interface is loopback.
      - name: Loopback-only network
        run: |
          cargo test -p windowcast-transport --test loopback --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "loopback") | .executable'             > loopback-test-path
          sudo unshare -n sh -c "ip link set lo up && $(cat loopback-test-path)"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  linux-sway:
    # The Linux agent against a real compositor: a headless sway (Arch's,
    # for ext-image-copy-capture and the toplevel capture source, which
    # Ubuntu's sway 1.9 lacks) runs a test window that the agent captures,
    # streams over loopback and types into.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust nasm cmake sway wayland libxkbcommon xkeyboard-config

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the agent's tests
        run: cargo test -p windowcast-agent-linux --no-run

      - name: Capture and input under headless sway
        shell: bash
        run: |
          trap 'echo "--- sway log"; cat /tmp/sway.log' EXIT
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          printf 'output HEADLESS-1 resolution 1280x720\n' > /tmp/sway.cfg
          # Arch's sway carries a file capability (cap_sys_nice) the
          # container may not grant, which fails exec; a plain copy has none.
          cp "$(command -v sway)" /tmp/sway
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            /tmp/sway -c /tmp/sway.cfg > /tmp/sway.log 2>&1 &
          for i in $(seq 1 100); do ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock >/dev/null 2>&1 && break; sleep 0.1; done
          export WAYLAND_DISPLAY=$(cd "$XDG_RUNTIME_DIR" && ls wayland-* | grep -v lock | head -1)
          export SWAYSOCK=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock | head -1)
          WINDOWCAST_TEST_SWAY=1 cargo test -p windowcast-agent-linux -- --nocapture
