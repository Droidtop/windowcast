[workspace]
resolver = "2"
members = [
    "protocol",
    "pty",
    "terminal",
    "identity",
    "accounts",
    "pairing",
    "fec",
    "gamestream",
    "rdp",
    "rendezvous",
    "discovery",
    "vnc",
    "transport",
    "bud",
    "host-core",
    "client-core",
    "agent-linux",
    "agent-android",
    "agent-windows",
    "cli-tools",
    "client-windows",
    "app",
    "windowcast-secure-helper",
]

[workspace.package]
version = "0.38.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/windowcast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

