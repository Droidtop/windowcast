[workspace]
resolver = "2"
members = [
    "protocol",
    "identity",
    "pairing",
    "directory",
    "apollo-client",
    "transport",
    "host-core",
    "client-core",
    "agent-linux",
    "agent-windows",
    "cli-tools",
    "client-windows",
    "app",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/windowcast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
